name: Mirror to SourceForge

on:
  push:
    branches: [main]
    tags: ['*']
  delete:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to SourceForge
        env:
          SF_SSH_KEY: ${{ secrets.SOURCEFORGE }}
        run: |
          mkdir -p ~/.ssh
          echo "$SF_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan git.code.sf.net >> ~/.ssh/known_hosts
          git remote add sourceforge ssh://elbutschito@git.code.sf.net/p/lessheadcms/code
          git push sourceforge refs/remotes/origin/main:refs/heads/main --force
          git push sourceforge --prune 'refs/tags/*:refs/tags/*'

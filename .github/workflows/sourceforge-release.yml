name: Release to SourceForge

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release-Tag, z.B. v0.2.0'
        required: true

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Release-Dateien von GitHub holen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir dist
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -D dist
          ls -la dist

      - name: Nach SourceForge hochladen
        env:
          SF_SSH_KEY: ${{ secrets.SOURCEFORGE }}
        run: |
          mkdir -p ~/.ssh
          echo "$SF_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan frs.sourceforge.net >> ~/.ssh/known_hosts
          rsync -av -e ssh dist/ "elbutschito@frs.sourceforge.net:/home/frs/project/lessheadcms/$TAG/"

      - name: Als Standard-Download setzen
        env:
          SF_API_KEY: ${{ secrets.SOURCEFORGE_API_KEY }}
        run: |
          for f in dist/*.zip; do
            name=$(basename "$f")
            for i in 1 2 3 4 5; do
              if curl -sf -H "Accept: application/json" -X PUT \
                -d "default=windows&default=mac&default=linux&default=bsd&default=solaris&default=others" \
                -d "api_key=$SF_API_KEY" \
                "https://sourceforge.net/projects/lessheadcms/files/$TAG/$name"; then
                echo "Standard-Download gesetzt: $name"
                break
              fi
              echo "Datei noch nicht bereit, warte 30 Sekunden..."
              sleep 30
            done
          done

name: Release to SourceForge

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release-Tag, z.B. v0.2.0'
        required: true

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Release-Dateien von GitHub holen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir dist
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -D dist
          ls -la dist

      - name: Nach SourceForge hochladen
        env:
          SF_SSH_KEY: ${{ secrets.SOURCEFORGE }}
        run: |
          mkdir -p ~/.ssh
          echo "$SF_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan frs.sourceforge.net >> ~/.ssh/known_hosts
          rsync -av -e ssh dist/ "elbutschito@frs.sourceforge.net:/home/frs/project/lessheadcms/$TAG/"
